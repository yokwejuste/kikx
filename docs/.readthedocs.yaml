version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  commands:
    - pip install --upgrade -r docs/requirements.txt
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - sphinx-build -W --keep-going -b html -D language=en docs/source $READTHEDOCS_OUTPUT/html
    - sphinx-build -W --keep-going -b html -D language=fr docs/source $READTHEDOCS_OUTPUT/html/fr
