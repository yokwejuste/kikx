site_name: kikx
site_description: Vendor real, editable infrastructure files straight into your project.
repo_url: https://github.com/yokwejuste/kikx
docs_dir: content

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Tutorials: Tutoriels
            How-to guides: Guides pratiques
            Reference: Référence
            Explanation: Explications

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: README.md
  - Tutorials:
      - tutorials/first-project-cli.md
      - tutorials/platform-in-the-dashboard.md
  - How-to guides:
      - how-to/run-the-dashboard.md
      - how-to/import-an-inventory.md
      - how-to/multi-play-playbooks.md
      - how-to/group-vars.md
      - how-to/site-playbook.md
      - how-to/scaffold-roles.md
      - how-to/resolve-conflicts.md
      - how-to/presets.md
      - how-to/export-to-drawio.md
      - how-to/custom-registry-item.md
  - Reference:
      - reference/cli.md
      - reference/components.md
      - reference/http-api.md
      - reference/configuration.md
      - reference/preset-format.md
      - reference/registry-item-format.md
      - reference/checks.md
  - Explanation:
      - explanation/vendoring.md
      - explanation/registry.md
      - explanation/rendering.md
      - explanation/architecture-diagram.md
      - explanation/project-layout.md
