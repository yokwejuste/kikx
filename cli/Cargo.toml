[package]
name = "kikx"
version = "0.4.0"
edition = "2021"
authors = ["Steve Yonkeu <steve@yokwejuste.me>"]
license = "MIT"
description = "Vendor real, editable infrastructure files into your project"
repository = "https://github.com/yokwejuste/kikx"

[[bin]]
name = "kikx"
path = "src/main.rs"

[lib]
name = "kikx"
path = "src/lib.rs"

[dependencies]
kikx-core = { path = "../backend/core" }
clap = { version = "4", features = ["derive"] }
anstream = "1"
anstyle = "1"
anyhow = "1"
similar = "2"
self_update = { version = "1.3", default-features = false, features = ["ureq", "rustls", "github", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_yaml_ng = "0.10"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints.rust]
unused = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
redundant_closure_for_method_calls = "warn"
map_unwrap_or = "warn"
