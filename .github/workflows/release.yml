name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match cli/Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep -m1 '^version' cli/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match cli/Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

  test:
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cd backend/core && cargo test
      - run: cd cli && cargo test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            asset_name: macos-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            asset_name: macos-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: tar.gz
            asset_name: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: tar.gz
            asset_name: linux-arm64
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            asset_name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-linker for aarch64-linux
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        working-directory: cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="kikx-${version}-${{ matrix.asset_name }}"
          mkdir "$name"
          cp cli/target/${{ matrix.target }}/release/kikx "$name/"
          cp README.md "$name/"
          tar czf "${name}.tar.gz" "$name"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          $name = "kikx-$version-${{ matrix.asset_name }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "cli/target/${{ matrix.target }}/release/kikx.exe" "$name/"
          Copy-Item "README.md" "$name/"
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - uses: softprops/action-gh-release@v3
        with:
          files: kikx-*.${{ matrix.archive }}
