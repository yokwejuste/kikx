<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kikx API</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 128 128%22 width=%22128%22 height=%22128%22%3E%3Cstyle%3Eg%7Bstroke:#0a0a0a%7Dcircle%7Bfill:#0a0a0a%7D%40media (prefers-color-scheme:dark)%7Bg%7Bstroke:#fafafa%7Dcircle%7Bfill:#fafafa%7D%7D%3C/style%3E%3Cg transform=%22translate(-7 0)%22 fill=%22none%22 stroke-width=%2218%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M30 14V114%22/%3E%3Cpath d=%22M30 80L76 34%22/%3E%3Cpath d=%22M50 62L74 100H86%22/%3E%3Ccircle cx=%22108%22 cy=%22100%22 r=%2213%22 stroke=%22none%22/%3E%3C/g%3E%3C/svg%3E">
  <style>
    body { margin: 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.72.2/dist/browser/standalone.js"></script>
  <script>
    Scalar.createApiReference("#app", {
      url: "/api/openapi.json",
      theme: "none",
      withDefaultFonts: false,
      showDeveloperTools: "never",
      agent: { disabled: true },
      mcp: { disabled: true },
      customCss: `
        :root {
          --scalar-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
          --scalar-font-code: ui-monospace, SFMono-Regular, Menlo, monospace;
          --scalar-radius: 6px;
        }
        .light-mode {
          --scalar-background-1: #ffffff;
          --scalar-background-2: #fafafa;
          --scalar-background-3: #f5f5f5;
          --scalar-background-accent: #f5f5f5;
          --scalar-border-color: #e5e5e5;
          --scalar-color-1: #0a0a0a;
          --scalar-color-2: #525252;
          --scalar-color-3: #737373;
          --scalar-color-accent: #0a0a0a;
          --scalar-button-1: #0a0a0a;
          --scalar-button-1-color: #ffffff;
          --scalar-button-1-hover: #262626;
        }
        .dark-mode {
          --scalar-background-1: #0a0a0a;
          --scalar-background-2: #141414;
          --scalar-background-3: #262626;
          --scalar-background-accent: #262626;
          --scalar-border-color: #2e2e2e;
          --scalar-color-1: #fafafa;
          --scalar-color-2: #a1a1a1;
          --scalar-color-3: #737373;
          --scalar-color-accent: #fafafa;
          --scalar-button-1: #fafafa;
          --scalar-button-1-color: #0a0a0a;
          --scalar-button-1-hover: #e5e5e5;
        }
        .light-mode, .dark-mode {
          --scalar-color-green: var(--scalar-color-1);
          --scalar-color-blue: var(--scalar-color-1);
          --scalar-color-orange: var(--scalar-color-1);
          --scalar-color-red: var(--scalar-color-1);
          --scalar-color-yellow: var(--scalar-color-1);
          --scalar-color-purple: var(--scalar-color-1);
          --scalar-sidebar-color-active: var(--scalar-color-1);
          --scalar-sidebar-item-active-background: var(--scalar-background-3);
        }
        a[href*="scalar.com"] { display: none; }
      `,
    });
  </script>
</body>
</html>
