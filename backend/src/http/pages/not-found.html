<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · kikx API</title>
  <style>
    :root {
      --background: #ffffff;
      --foreground: #0a0a0a;
      --muted: #737373;
      --border: #e5e5e5;
      --surface: #f5f5f5;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0a0a0a;
        --foreground: #fafafa;
        --muted: #a1a1a1;
        --border: #2e2e2e;
        --surface: #262626;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--background);
      color: var(--foreground);
      font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { width: 100%; max-width: 30rem; }
    .status {
      font: 600 0.75rem ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    h1 { margin: 0.5rem 0 0.75rem; font-size: 1.75rem; letter-spacing: -0.02em; line-height: 1.2; }
    p { margin: 0 0 1.75rem; color: var(--muted); }
    code {
      font: 0.875em ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--surface);
      color: var(--foreground);
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }
    nav { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    a {
      padding: 0.55rem 0.95rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--foreground);
      font-size: 0.9rem;
      text-decoration: none;
    }
    a:hover { border-color: var(--foreground); }
    a.primary { background: var(--foreground); border-color: var(--foreground); color: var(--background); }
  </style>
</head>
<body>
  <main>
    <div class="status">404 · NOT FOUND</div>
    <h1>Nothing lives at this address</h1>
    <p>This is the kikx API. Every endpoint sits under <code>/api</code>, and the reference lists each one and lets you try it from the browser.</p>
    <nav>
      <a class="primary" href="/docs">API reference</a>
      <a href="/api/openapi.json">OpenAPI spec</a>
      <a href="/api/health">Health</a>
    </nav>
  </main>
</body>
</html>
