[package]
name = "kikx-backend"
version = "0.0.1"
edition = "2021"
authors = ["Steve Yonkeu <steve@yokwejuste.me>"]
license = "MIT"

[lib]
name = "kikx_backend"
path = "src/lib.rs"

[[bin]]
name = "kikx-backend"
path = "src/main.rs"

[dependencies]
kikx-core = { path = "core", features = ["openapi"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.7", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
dotenvy = "0.15.7"
utoipa = "6"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
serde_yaml_ng = "0.10"
