[package]
name = "kikx-core"
version = "0.0.1"
edition = "2021"
authors = ["Steve Yonkeu <steve@yokwejuste.me>"]
license = "MIT"

[lib]
name = "kikx_core"
path = "src/lib.rs"

[dependencies]
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
ureq = "3"
utoipa = { version = "6", optional = true }

[features]
openapi = ["dep:utoipa"]

[dev-dependencies]
tempfile = "3"
