[package]
name = "kikx-core"
version = "0.0.1"
edition = "2021"
authors = ["Steve Yonkeu <steve@yokwejuste.me>"]
license = "MIT"

[lib]
name = "kikx_core"
path = "src/lib.rs"

[dependencies]
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
ureq = "3"
utoipa = { version = "6", optional = true }
ipnet = "2"

[features]
openapi = ["dep:utoipa"]

[dev-dependencies]
tempfile = "3"

[lints.rust]
unused = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
redundant_closure_for_method_calls = "warn"
map_unwrap_or = "warn"
